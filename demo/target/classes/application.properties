spring.application.name=demo
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/proyecto_finanzas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123}
spring.jpa.hibernate.ddl-auto = update
spring.user.datasource.driver-class-name=com.mysql.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8081}

# JWT Configuration parameters
# ***CHANGE THE VALUES OF THE FOLLOWING PARAMETERS BEFORE DEPLOYING TO PRODUCTION***
jwt.secret.key = ${JWT_SECRET:superSecretKeySuperSecureThatYouDontKnowWhichIs15061998}

jwt.access.token.expiration = 3600000

jwt.refresh.token.expiration = 86400000

jwt.token.registration = false